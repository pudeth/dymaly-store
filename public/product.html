<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Product Details - QKZ Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&family=Kantumruy:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/i18n.js"></script>
    <!-- Web App & Mobile Add to Home Screen Icons -->
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/images/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/images/icon-512.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a1410">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DyMaly">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-row">
                <a href="index.html" class="brand" aria-label="QKZ Store Home">
                    <span class="brand-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="5" y="2" width="14" height="20" rx="2.5" ry="2.5"></rect>
                            <line x1="12" y1="18" x2="12.01" y2="18"></line>
                        </svg>
                    </span>
                    <div class="brand-text">
                        <h1>QKZ Store</h1>
                        <p>Phones & audio, delivered fast</p>
                    </div>
                </a>
                <nav class="top-nav">
                    <a href="cart.html" class="cart-link" aria-label="Shopping Cart">
                        <svg class="cart-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                        <span class="nav-text">Cart</span>
                        <span class="cart-badge" id="cartBadge">0</span>
                    </a>
                    <a href="admin.html" class="admin-link" aria-label="Admin Dashboard">
                        <svg class="admin-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                        <span>Admin</span>
                    </a>
                </nav>
            </div>
            <div class="search-bar" onclick="window.location.href='index.html'" style="cursor: pointer;">
                <span class="search-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <input type="text" placeholder="Search phones, brands, accessories..." readonly>
            </div>
        </div>
    </header>

    <section class="product-detail">
        <div class="container">
            <a href="index.html" class="back-link">← Back to Products</a>

            <div id="productContent" class="loading">Loading product details...</div>
        </div>
    </section>

    <section class="reviews-section">
        <div class="container">
            <h2>Customer Reviews</h2>

            <div class="review-form-card">
                <h3>Write a Review</h3>
                <form id="reviewForm">
                    <div class="form-group">
                        <label for="customerName">Your Name *</label>
                        <input type="text" id="customerName" required>
                    </div>
                    <div class="form-group">
                        <label for="rating">Rating *</label>
                        <div class="star-rating">
                            <input type="radio" id="star5" name="rating" value="5" required>
                            <label for="star5" title="5 stars">★</label>
                            <input type="radio" id="star4" name="rating" value="4">
                            <label for="star4" title="4 stars">★</label>
                            <input type="radio" id="star3" name="rating" value="3">
                            <label for="star3" title="3 stars">★</label>
                            <input type="radio" id="star2" name="rating" value="2">
                            <label for="star2" title="2 stars">★</label>
                            <input type="radio" id="star1" name="rating" value="1">
                            <label for="star1" title="1 star">★</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="comment">Your Review</label>
                        <textarea id="comment" rows="4" placeholder="Share your experience with this phone..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit Review</button>
                </form>
            </div>

            <div id="reviewsList" class="reviews-list">
                <div class="loading">Loading reviews...</div>
            </div>
        </div>
    </section>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav">
        <div class="mobile-nav-container">
            <a href="index.html" class="nav-item">
                <span class="nav-icon"></span>
                <span class="nav-label">Home</span>
            </a>
            <a href="cart.html" class="nav-item">
                <div class="nav-icon-wrapper">
                    <span class="nav-icon"></span>
                    <span class="nav-badge" id="navCartBadge">0</span>
                </div>
                <span class="nav-label">Cart</span>
            </a>
            <a href="saved.html" class="nav-item">
                <span class="nav-icon"></span>
                <span class="nav-label">Saved</span>
            </a>
            <a href="admin.html" class="nav-item">
                <span class="nav-icon"></span>
                <span class="nav-label">Admin</span>
            </a>
        </div>
    </nav>

    <!-- Scroll to Top Button -->
    <button class="scroll-to-top" id="scrollToTopBtn" aria-label="Scroll to top">
        <div class="progress-ring"></div>
    </button>

    <script src="js/product.js"></script>
</body>
</html>
